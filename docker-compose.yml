# Default stack: qdrant + API + dashboard, using the host's Ollama (via OLLAMA_HOST).
#   make up         # this file
#   make up-ollama  # also bundle Ollama in-container (adds docker-compose.bundled.yml)

services:
  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build: .
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}   # host's Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resolve on Linux too
    env_file:
      - .env   # optional OPENAI_API_KEY / GROQ_API_KEY
    volumes:
      - hf_cache:/root/.cache       # model downloads
      - app_cache:/app/cache        # embeddings / chunks / index
      - ./data:/app/data            # corpus
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 600s   # first boot blocks on warmup (model downloads + embedding)
    ports:
      - "8000:8000"

  dashboard:
    build: .
    command: streamlit run dashboard/Home.py --server.address 0.0.0.0 --server.port 8501
    environment:
      RAG_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  qdrant_storage:
  hf_cache:
  app_cache:
